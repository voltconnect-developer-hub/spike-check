name: Bug
description: Something in this project doesn't work as it should.
title: "Short description of the problem"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't report it here. Tell the maintainers through the
        project in VoltConnect instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Device, browser or operating system, and the version or commit, if you know it.
    validations:
      required: false
