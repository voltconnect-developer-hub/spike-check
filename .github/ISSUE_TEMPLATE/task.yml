name: Task
description: A piece of work someone can pick up. Maintainers write these.
title: "Short description of the task"
body:
  - type: markdown
    attributes:
      value: |
        A task shows in VoltConnect as soon as it's opened. Add a `level:` label
        (beginner, intermediate or pro), a `scope:` label (small, medium or large),
        and `good first issue` if it suits someone new.
  - type: textarea
    id: goal
    attributes:
      label: What needs doing
      description: The outcome, in plain words. Someone new to the project should understand it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where to start
      description: Files, screens or links that help. Say what's already been tried, if anything.
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer will know it's finished. The merged pull request is the evidence.
      placeholder: |
        - The settings screen shows the new option.
        - The existing tests still pass.
    validations:
      required: true
